<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoX | Bio Page</title>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent-color: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.4);
      --card-bg: rgba(18, 18, 24, 0.65);
      --text-color: #ffffff;
      --subtext-color: #a1a1aa;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #09090b;
      color: var(--text-color);
    }

    /* Background Video */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.65);
    }

    /* Click-to-Enter Overlay */
    #enter-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 9, 11, 0.95);
      backdrop-filter: blur(15px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #enter-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .enter-text {
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 2px;
      color: var(--subtext-color);
      text-transform: uppercase;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Glassmorphism Card */
    .profile-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  0 0 30px var(--accent-glow);
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    /* Avatar */
    .avatar-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 16px;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    /* Username & Bio */
    .username {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .badge {
      color: var(--accent-color);
      font-size: 1rem;
    }

    .bio {
      color: var(--subtext-color);
      font-size: 0.9rem;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    /* Social Links */
    .social-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: var(--text-color);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .link-btn i {
      font-size: 1.2rem;
      width: 24px;
      text-align: center;
    }

    .link-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-color);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px var(--accent-glow);
    }

    /* Audio Player Control */
    .audio-player {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px 16px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--subtext-color);
      overflow: hidden;
      white-space: nowrap;
    }

    .audio-btn {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 1rem;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .audio-btn:hover {
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <!-- Entry Overlay -->
  <div id="enter-overlay">
    <div class="enter-text">[ Click anywhere to enter ]</div>
  </div>

  <!-- Background Video Element -->
  <video id="bg-video" autoplay loop muted playsinline>
    <source src="bg.mp4" type="video/mp4">
  </video>

  <!-- Audio Element -->
  <audio id="bg-audio" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <!-- Main Content -->
  <div class="container">
    <div class="profile-card">
      
      <!-- Avatar -->
      <div class="avatar-wrapper">
        <img src="avatar.jpg" alt="FoX Avatar" class="avatar-img">
      </div>

      <!-- User Info -->
      <h1 class="username">
        FoX
        <i class="fa-solid fa-circle-check badge" title="Verified"></i>
      </h1>
      <p class="bio">Welcome to my page.</p>

      <!-- Social Links -->
      <div class="social-links">
        <a href="https://discord.com" target="_blank" class="link-btn">
          <span><i class="fa-brands fa-discord"></i> Discord</span>
          <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem; opacity: 0.5;"></i>
        </a>
        <a href="https://www.instagram.com/t6x9s?stkn=N2ZlNDZkeHV3dTdz" target="_blank" class="link-btn">
          <span><i class="fa-brands fa-instagram"></i> Instagram</span>
          <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem; opacity: 0.5;"></i>
        </a>
        <a href="https://github.com" target="_blank" class="link-btn">
          <span><i class="fa-brands fa-github"></i> GitHub</span>
          <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem; opacity: 0.5;"></i>
        </a>
      </div>

      <!-- Audio Widget -->
      <div class="audio-player">
        <div class="track-info">
          <i class="fa-solid fa-music" style="color: var(--accent-color);"></i>
          <span id="track-name">Background Music Track</span>
        </div>
        <button id="audio-toggle" class="audio-btn">
          <i class="fa-solid fa-pause" id="audio-icon"></i>
        </button>
      </div>

    </div>
  </div>

  <script>
    const overlay = document.getElementById('enter-overlay');
    const audio = document.getElementById('bg-audio');
    const audioToggle = document.getElementById('audio-toggle');
    const audioIcon = document.getElementById('audio-icon');
    const bgVideo = document.getElementById('bg-video');

    overlay.addEventListener('click', () => {
      overlay.classList.add('hidden');
      audio.volume = 0.3;
      audio.play().catch(e => console.log("Audio play blocked:", e));
      if (bgVideo) {
        bgVideo.play().catch(e => console.log("Video play blocked:", e));
      }
    });

    audioToggle.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        audioIcon.className = 'fa-solid fa-pause';
      } else {
        audio.pause();
        audioIcon.className = 'fa-solid fa-play';
      }
    });
  </script>
</body>
</html>
