
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoX // CYBER_HUD</title>

  <!-- FontAwesome Icons & Sci-Fi Font -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cyber-red: #ff003c;
      --cyber-red-glow: rgba(255, 0, 60, 0.5);
      --cyber-dark: rgba(10, 10, 14, 0.85);
      --border-color: rgba(255, 0, 60, 0.3);
      --text-main: #ffffff;
      --text-sub: #8e8e9f;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Rajdhani', sans-serif;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050508;
      color: var(--text-main);
    }

    /* Background Video */
    #bg-video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      z-index: 1;
      transform: translate(-50%, -50%);
      object-fit: cover;
      filter: brightness(0.4) contrast(1.2);
    }

    /* CRT Scanlines & Grid Overlay */
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }

    /* Tap to Enter Overlay */
    #enter-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #050508;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      cursor: pointer;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #enter-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .enter-box {
      border: 1px solid var(--cyber-red);
      padding: 20px 40px;
      background: rgba(255, 0, 60, 0.05);
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      box-shadow: 0 0 20px var(--cyber-red-glow);
    }

    .enter-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 3px;
      color: var(--cyber-red);
      text-transform: uppercase;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* HUD Layout Container */
    .hud-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Cyber Card Main Panel */
    .hud-card {
      position: relative;
      width: 100%;
      max-width: 440px;
      background: var(--cyber-dark);
      border: 1px solid var(--border-color);
      clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
      padding: 30px 24px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(255, 0, 60, 0.1);
    }

    /* Decorative Corner Elements */
    .hud-card::before {
      content: "SYS.LOC // 0x99";
      position: absolute;
      top: 6px;
      right: 15px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      color: var(--cyber-red);
      letter-spacing: 1px;
    }

    /* Avatar Section */
    .avatar-box {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 10px auto 20px;
    }

    .avatar-frame {
      width: 100%;
      height: 100%;
      clip-path: polygon(15% 0, 100% 0, 100% 85%, 85% 100%, 0 100%, 0 15%);
      background: var(--cyber-red);
      padding: 3px;
      box-shadow: 0 0 20px var(--cyber-red-glow);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      clip-path: polygon(15% 0, 100% 0, 100% 85%, 85% 100%, 0 100%, 0 15%);
    }

    /* Glitch Title */
    .glitch-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      text-transform: uppercase;
      text-align: center;
      color: #fff;
      position: relative;
      text-shadow: 2px 2px var(--cyber-red);
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--cyber-red);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background-color: var(--cyber-red);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cyber-red);
      animation: blink 1s infinite;
    }

    .bio {
      color: var(--text-sub);
      font-size: 0.95rem;
      text-align: center;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Cyber Link Modules */
    .links-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 25px;
    }

    .cyber-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.02);
      border-left: 3px solid var(--cyber-red);
      border-top: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 1px;
      transition: all 0.25s ease;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
    }

    .cyber-btn i {
      font-size: 1.2rem;
      color: var(--cyber-red);
      margin-right: 10px;
    }

    .cyber-btn:hover {
      background: rgba(255, 0, 60, 0.15);
      border-left-color: #ffffff;
      transform: translateX(4px);
      box-shadow: -5px 0 15px var(--cyber-red-glow);
    }

    /* Audio Equalizer Widget */
    .audio-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
    }

    .audio-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .audio-toggle-btn {
      background: none;
      border: none;
      color: var(--cyber-red);
      font-size: 1.1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Tap Overlay -->
  <div id="enter-overlay">
    <div class="enter-box">
      <div class="enter-text">[ SYS_INIT // TAP TO DECRYPT ]</div>
    </div>
  </div>

  <!-- Background Scanline effect -->
  <div class="scanlines"></div>

  <!-- Background Video (Fallback support included) -->
  <video id="bg-video" autoplay loop muted playsinline webkit-playsinline preload="auto">
    <source src="bg.mp4" type="video/mp4">
    <source src="1000060435.mp4" type="video/mp4">
  </video>

  <!-- Background Audio -->
  <audio id="bg-audio" loop preload="auto">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <!-- Main HUD Layout -->
  <div class="hud-container">
    <div class="hud-card">
      
      <!-- Avatar -->
      <div class="avatar-box">
        <div class="avatar-frame">
          <img 
            src="avatar.jpg" 
            alt="FoX Avatar" 
            class="avatar-img"
            onerror="if (this.src.indexOf('1000058943.jpg') == -1) { this.src='1000058943.jpg'; } else { this.src='https://i.postimg.cc/0jXqHz3b/avatar-placeholder.png'; }"
          >
        </div>
      </div>

      <!-- User Title & Status -->
      <div style="text-align: center;">
        <h1 class="glitch-title">FoX</h1>
        <div class="status-badge">
          <span class="dot"></span> DOMAIN_EXPANSION // ACTIVE
        </div>
        <p class="bio">Welcome to my terminal</p>
      </div>

      <!-- Links Modules -->
      <div class="links-grid">
        <a href="https://discord.com" target="_blank" class="cyber-btn">
          <span><i class="fa-brands fa-discord"></i> DISCORD</span>
          <i class="fa-solid fa-angle-right"></i>
        </a>
        <a href="https://www.instagram.com/t6x9s?stkn=N2ZlNDZkeHV3dTdz" target="_blank" class="cyber-btn">
          <span><i class="fa-brands fa-instagram"></i> INSTAGRAM</span>
          <i class="fa-solid fa-angle-right"></i>
        </a>
        <a href="https://github.com" target="_blank" class="cyber-btn">
          <span><i class="fa-brands fa-github"></i> GITHUB</span>
          <i class="fa-solid fa-angle-right"></i>
        </a>
      </div>

      <!-- Audio Widget -->
      <div class="audio-hud">
        <div class="audio-info">
          <i class="fa-solid fa-wave-square" style="color: var(--cyber-red);"></i>
          <span>AUDIO_FEED // SUKUNA_OST</span>
        </div>
        <button id="audio-toggle" class="audio-toggle-btn">
          <i class="fa-solid fa-pause" id="audio-icon"></i>
        </button>
      </div>

    </div>
  </div>

  <script>
    const overlay = document.getElementById('enter-overlay');
    const audio = document.getElementById('bg-audio');
    const audioToggle = document.getElementById('audio-toggle');
    const audioIcon = document.getElementById('audio-icon');
    const bgVideo = document.getElementById('bg-video');

    // Force video initialization on page load
    window.addEventListener('load', () => {
      if (bgVideo) {
        bgVideo.muted = true;
        bgVideo.play().catch(() => {});
      }
    });

    // Tap overlay to decrypt / enter page
    overlay.addEventListener('click', () => {
      overlay.classList.add('hidden');
      audio.volume = 0.4;
      audio.play().catch(e => console.log("Audio play blocked:", e));
      if (bgVideo) {
        bgVideo.muted = true;
        bgVideo.play().catch(e => console.log("Video play blocked:", e));
      }
    });

    // Audio Play/Pause toggle
    audioToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      if (audio.paused) {
        audio.play();
        audioIcon.className = 'fa-solid fa-pause';
      } else {
        audio.pause();
        audioIcon.className = 'fa-solid fa-play';
      }
    });
  </script>
</body>
</html>
